<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flashcards Year 5</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
:root {
    --primary: #283593;
    --secondary: #e65100;
    --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    --color-en: #3f51b5;
    --color-es: #ff9800;
    --color-success: #4caf50;
    --color-error: #f44336;
}

body {
    margin: 0; font-family: "Segoe UI", Tahoma, sans-serif;
    background: var(--bg-gradient); min-height: 100vh;
    padding: 10px; display: flex;
    flex-direction: column; align-items: center;
}

.app {
    width: 100%; max-width: 500px;
    background: rgba(255, 255, 255, 0.95); border-radius: 30px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1); overflow: hidden;
    display: flex; flex-direction: column;
}

header { 
    background: var(--primary); color: #fff; padding: 12px;
    text-align: center; display: flex; justify-content: center; align-items: center; gap: 10px; 
    font-size: 1.8rem; 
    font-weight: bold;
}
header img { width: 25px; border-radius: 50%; border: 1px solid white; }

.exam-bar { background: #333; color: white; padding: 8px 15px; display: none; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: bold; }

.progress-container { width: 100%; height: 6px; background: #eee; }
.progress-bar { width: 0%; height: 100%; background: var(--color-en); transition: width 0.3s; }

.mode-selector { display: flex; padding: 8px; gap: 5px; background: #fff; border-bottom: 1px solid #eee; }
.mode-btn { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 10px; background: #f8f9fa; color: #666; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; transition: 0.2s; font-size: 0.75rem; }
.mode-btn img { width: 15px; border-radius: 50%; }

/* ESTADOS ACTIVOS DE LOS BOTONES */
.mode-btn.active.en-es { background: var(--color-en); color: white; border-color: var(--color-en); }
.mode-btn.active.es-en { background: var(--color-es); color: white; border-color: var(--color-es); }
.mode-btn.exam.active { background: #90EE90; color: #1a5a1a; border-color: #76c976; }

.controls-top { padding: 10px; text-align: center; }
select { padding: 8px; border-radius: 15px; border: 2px solid #ccc; font-weight: bold; width: 95%; cursor: pointer; }

.mix-panel { display: none; background: #f1f1f1; padding: 12px; margin: 0 10px 10px 10px; border-radius: 15px; text-align: left; max-height: 180px; overflow-y: auto; font-size: 0.9rem; }

.scene { width: 100%; height: 320px; perspective: 1000px; display: flex; justify-content: center; align-items: center; }
.card { width: 280px; height: 260px; position: relative; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; cursor: pointer; }
.card.is-flipped { transform: rotateY(180deg); }
.card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 25px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; border: 5px solid #fff; box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
.lang-en { background: var(--color-en); color: white; }
.lang-es { background: var(--color-es); color: white; }
.card-face.back { transform: rotateY(180deg); }

.flag-label { width: 40px; height: 40px; margin-bottom: 12px; border-radius: 50%; border: 2px solid white; }
.main-text { font-size: 1.8rem; font-weight: 900; text-transform: uppercase; text-align: center; line-height: 1.1; }

.exam-actions { display: none; gap: 20px; margin-top: 15px; }
.action-btn { border: none; border-radius: 50%; width: 55px; height: 55px; color: white; font-size: 1.6rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
.btn-yes { background: var(--color-success); }
.btn-no { background: var(--color-error); }

.nav-controls { display: flex; justify-content: space-between; align-items: center; padding: 10px 25px; background: #f8f9fa; }
.nav-btn { background: white; border: 1px solid #ddd; width: 45px; height: 45px; border-radius: 50%; font-size: 1.3rem; cursor: pointer; }
.counter { font-weight: bold; color: #555; font-size: 0.9rem; }

.sound-btn { background: rgba(255,255,255,0.2); border: 2px solid #fff; color: #fff; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; font-size: 1.2rem; margin-top: 10px; }
</style>
</head>
<body>

<div class="app">
    <div class="exam-bar" id="examBar">
        <span>⏱️ <span id="timer">00:00</span></span>
        <span>🔥 <span id="streak">0</span></span>
        <span>✅ <span id="scoreCorrect">0</span> | ❌ <span id="scoreWrong">0</span></span>
    </div>
    <div class="progress-container"><div id="progressBar" class="progress-bar"></div></div>

    <header>
        <img src="english.png"> Flashcards Year 5 <img src="spanish.png">
    </header>

    <div class="mode-selector">
        <button id="btnEnEs" class="mode-btn active en-es" onclick="setMode('EN-ES')"><img src="english.png"> EN➔ES</button>
        <button id="btnEsEn" class="mode-btn es-en" onclick="setMode('ES-EN')"><img src="spanish.png"> ES➔EN</button>
        <button id="btnExam" class="mode-btn exam" onclick="toggleExamMode()">🎓 EXAM</button>
    </div>

    <div class="controls-top">
        <select id="categorySelect" onchange="handleCategoryChange()">
            <option value="ALL">🌟 All Topics (Mix All)</option>
            <option value="MIXED">🧩 Mix Selected Topics...</option>
        </select>
    </div>

    <div id="mixPanel" class="mix-panel">
        <strong>Mix categories:</strong><hr>
        <div id="mixCheckboxes"></div>
        <button style="width:100%; margin-top:8px; padding:5px; border-radius:10px;" onclick="changeCategory()">Apply Mix</button>
    </div>

    <div class="scene">
        <div class="card" id="flashcard" onclick="flipCard()">
            <div class="card-face front lang-en" id="faceFront">
                <img id="flagFront" class="flag-label" src="english.png">
                <div class="main-text" id="textFront">...</div>
            </div>
            <div class="card-face back lang-es" id="faceBack">
                <img id="flagBack" class="flag-label" src="spanish.png">
                <div class="main-text" id="textBack">...</div>
                <div id="examActions" class="exam-actions">
                    <button class="action-btn btn-no" onclick="event.stopPropagation(); markResult(false)">❌</button>
                    <button class="action-btn btn-yes" onclick="event.stopPropagation(); markResult(true)">✅</button>
                </div>
                <button id="soundBtn" class="sound-btn" onclick="event.stopPropagation(); playCurrentAudio()">🔊</button>
            </div>
        </div>
    </div>

    <div class="nav-controls">
        <button class="nav-btn" id="prevBtn" onclick="prevCard()">⬅️</button>
        <div class="counter" id="counterDisplay">0 / 0</div>
        <button class="nav-btn" id="nextBtn" onclick="nextCard()">➡️</button>
    </div>
</div>

    {en:"find", es:"encontrar", cat:"Verbs", emoji:"🏃"}, {en:"choose", es:"elegir", cat:"Verbs", emoji:"🏃"}
];

let currentList = [], currentIndex = 0, isFlipped = false, errorList = [];
let gameMode = 'EN-ES', isExamMode = false;
let seconds = 0, timerInterval = null, correct = 0, wrong = 0, currentStreak = 0;

const ui = {
    card: document.getElementById("flashcard"),
    faceFront: document.getElementById("faceFront"),
    faceBack: document.getElementById("faceBack"),
    textFront: document.getElementById("textFront"),
    textBack: document.getElementById("textBack"),
    flagFront: document.getElementById("flagFront"),
    flagBack: document.getElementById("flagBack"),
    counter: document.getElementById("counterDisplay"),
    prevBtn: document.getElementById("prevBtn"),
    nextBtn: document.getElementById("nextBtn"),
    catSelect: document.getElementById("categorySelect"),
    examBar: document.getElementById("examBar"),
    timer: document.getElementById("timer"),
    streak: document.getElementById("streak"),
    scoreCorrect: document.getElementById("scoreCorrect"),
    scoreWrong: document.getElementById("scoreWrong"),
    examActions: document.getElementById("examActions"),
    soundBtn: document.getElementById("soundBtn"),
    mixPanel: document.getElementById("mixPanel"),
    mixCheckboxes: document.getElementById("mixCheckboxes"),
    progressBar: document.getElementById("progressBar")
};

const categoryOrder = [
    { name: "Ordinal Numbers", emoji: "🔢" }, { name: "Classroom", emoji: "🎒" },
    { name: "Countries", emoji: "🌍" }, { name: "Pronouns", emoji: "👤" },
    { name: "Free time", emoji: "🎨" }, { name: "Adverbs of frequency", emoji: "⏳" },
    { name: "Genres", emoji: "🎬" }, { name: "Opinions", emoji: "💬" },
    { name: "Animals", emoji: "🦁" }, { name: "Animal adjectives", emoji: "🐾" },
    { name: "Personality", emoji: "🧠" }, { name: "Inventions", emoji: "💡" },
    { name: "Verbs", emoji: "🏃" }
];

function initCategories() {
    categoryOrder.forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat.name; opt.textContent = `${cat.emoji} ${cat.name}`;
        ui.catSelect.appendChild(opt);
        const div = document.createElement("div");
        div.innerHTML = `<input type="checkbox" value="${cat.name}" id="cb_${cat.name}"> <label for="cb_${cat.name}">${cat.emoji} ${cat.name}</label>`;
        ui.mixCheckboxes.appendChild(div);
    });
    changeCategory();
}

function handleCategoryChange() {
    if(ui.catSelect.value === "MIXED") ui.mixPanel.style.display = "block";
    else { ui.mixPanel.style.display = "none"; changeCategory(); }
}

function changeCategory() {
    const val = ui.catSelect.value;
    if(val === "ALL") currentList = [...vocab];
    else if(val === "MIXED") {
        const checked = Array.from(ui.mixCheckboxes.querySelectorAll('input:checked')).map(i => i.value);
        currentList = vocab.filter(v => checked.includes(v.cat));
        if(currentList.length === 0) { alert("Select at least one!"); return; }
    } else currentList = vocab.filter(v => v.cat === val);
    
    currentList = shuffleArray(currentList);
    currentIndex = 0;
    resetCardFace();
    updateUI();
}

function updateUI() {
    if(currentList.length === 0) return;
    const item = currentList[currentIndex];
    const isEN = gameMode === 'EN-ES';
    
    ui.textFront.textContent = isEN ? item.en : item.es;
    ui.textBack.textContent = isEN ? item.es : item.en;
    ui.flagFront.src = isEN ? "english.png" : "spanish.png";
    ui.flagBack.src = isEN ? "spanish.png" : "english.png";
    
    ui.faceFront.className = `card-face front lang-${isEN ? 'en' : 'es'}`;
    ui.faceBack.className = `card-face back lang-${isEN ? 'es' : 'en'}`;
    
    ui.counter.textContent = `${currentIndex + 1} / ${currentList.length}`;
    ui.progressBar.style.width = `${((currentIndex + 1) / currentList.length) * 100}%`;
}

function flipCard() { isFlipped = !isFlipped; ui.card.classList.toggle("is-flipped", isFlipped); }
function resetCardFace() { isFlipped = false; ui.card.classList.remove("is-flipped"); }
function nextCard() { if(currentIndex < currentList.length - 1) { currentIndex++; resetCardFace(); updateUI(); } }
function prevCard() { if(currentIndex > 0) { currentIndex--; resetCardFace(); updateUI(); } }
function shuffleArray(arr) { return arr.sort(() => Math.random() - 0.5); }

function setMode(mode) {
    gameMode = mode;
    document.getElementById("btnEnEs").classList.toggle("active", mode === 'EN-ES');
    document.getElementById("btnEsEn").classList.toggle("active", mode === 'ES-EN');
    ui.progressBar.style.background = mode === 'EN-ES' ? 'var(--color-en)' : 'var(--color-es)';
    resetCardFace(); updateUI();
}

function toggleExamMode() {
    isExamMode = !isExamMode;
    document.getElementById("btnExam").classList.toggle("active", isExamMode);
    ui.examBar.style.display = isExamMode ? "flex" : "none";
    ui.examActions.style.display = isExamMode ? "flex" : "none";
    ui.soundBtn.style.display = isExamMode ? "none" : "block";
    if(isExamMode) startExam(); else resetExam();
}

function startExam() {
    resetExam();
    timerInterval = setInterval(() => {
        seconds++;
        ui.timer.textContent = `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
    }, 1000);
}

function resetExam() { clearInterval(timerInterval); seconds = 0; correct = 0; wrong = 0; currentStreak = 0; ui.timer.textContent = "00:00"; ui.scoreCorrect.textContent = "0"; ui.scoreWrong.textContent = "0"; ui.streak.textContent = "0"; }

function markResult(isCorrect) {
    if(isCorrect) { correct++; currentStreak++; } 
    else { wrong++; currentStreak = 0; errorList.push(currentList[currentIndex]); }
    ui.scoreCorrect.textContent = correct; ui.scoreWrong.textContent = wrong; ui.streak.textContent = currentStreak;
    
    if(currentIndex === currentList.length - 1) {
        clearInterval(timerInterval);
        alert(`Finished!\nScore: ${correct}/${currentList.length}`);
        toggleExamMode();
    } else nextCard();
}

function playCurrentAudio() {
    const text = isFlipped ? ui.textBack.textContent : ui.textFront.textContent;
    const lang = isFlipped ? (gameMode === 'EN-ES' ? 'es-ES' : 'en-US') : (gameMode === 'EN-ES' ? 'en-US' : 'es-ES');
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = lang;
    window.speechSynthesis.speak(msg);
}

window.onload = initCategories;
</script>
</body>
</html>
